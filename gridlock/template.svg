<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">

<!--

#### FILE: WIDTH HEIGHT BOARDS
<svg width="%WIDTH%" height="%HEIGHT%" xmlns="http://www.w3.org/2000/svg">
%BOARDS%
</svg>

#### BOARD: X Y WIDTH HEIGHT COLOR CELLS PIECES TEXT SCALE
<g transform="translate(%X%,%Y%) scale(%SCALE%)">
    <rect width="%WIDTH%" height="%HEIGHT%" x="-4" y="-4" stroke="none" fill="%COLOR%"/>
    %CELLS%
    %PIECES%
    %TEXT%
</g>

#### BOARD_TEXT: X Y TEXT COLOR
<text x="%X%" y="%Y%" dominant-baseline="central" text-anchor="middle" fill="%COLOR%" style="font-size: 28">%TEXT%</text>

#### CELL: X Y
<g transform="translate(%X%,%Y%)">
    <rect width="32" height="32" x="0" y="0" stroke="#909090" fill="#909090" />
    <rect width="16" height="16" x="8" y="8" fill="none" stroke="black"/> 
</g>

